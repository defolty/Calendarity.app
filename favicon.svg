<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="100" height="100" rx="20" fill="url(#grad)"/>

  <!-- Календарь -->
  <rect x="20" y="25" width="60" height="55" rx="5" fill="white"/>

  <!-- Верхняя часть календаря -->
  <rect x="20" y="25" width="60" height="15" rx="5" fill="white" opacity="0.3"/>

  <!-- Кольца для крепления -->
  <rect x="30" y="20" width="4" height="10" rx="2" fill="white"/>
  <rect x="66" y="20" width="4" height="10" rx="2" fill="white"/>

  <!-- Дата - большая цифра -->
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#grad)" text-anchor="middle">15</text>
</svg>
